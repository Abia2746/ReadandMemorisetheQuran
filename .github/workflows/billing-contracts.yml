name: Billing contract checks

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/web/components/billing/**"
      - "apps/web/lib/nativeBilling.ts"
      - ".github/workflows/billing-contracts.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/components/billing/**"
      - "apps/web/lib/nativeBilling.ts"

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r apps/api/requirements.txt
      - run: python -m compileall -q apps/api/app
      - run: PYTHONPATH=apps/api python -m pytest -q apps/api/tests
      - name: Verify no advertisement SDK dependencies
        run: |
          if grep -RiE 'google-mobile-ads|facebook-audience-network|admob|ad_sdk' apps/api apps/web --exclude='*.md' | grep -vE 'No advertising|no-ad|No ads|zero-ad' ; then
            echo "Advertising SDK reference found"
            exit 1
          fi
