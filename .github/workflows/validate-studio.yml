name: Validate Al-Muallim studio
on:
  push:
    branches: ["main", "design/**"]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python source
        run: python -m py_compile app.py studio_ui.py supabase_auth.py auth_callback.py cloud_profile.py cloud_learning.py stripe_checkout.py stripe_membership.py streamlit_pricing.py live_auth.py timing_data.py audio_embed.py tajweed_review.py prayer_room.py prayer_clock.py hifdh_planner.py tests/test_hifdh_planner.py tests/test_hifdh_planner_cloud.py tests/test_prayer_room_cloud.py tests/test_auth_callback_security.py tests/test_live_auth.py tests/test_timing_data.py tests/test_tajweed_review.py tests/test_prayer_room.py tests/test_prayer_clock.py
      - name: Install minimal test dependency
        run: python -m pip install requests
      - name: Check token and streaming integration tests
        run: python -m unittest discover -s tests -v
      - name: Check browser frontend syntax
        run: node --check studio.js
      - name: Verify Quran listener and memorisation highlighting
        run: node tests/studio-ui.test.mjs
      - name: Verify repeat-aware reciter audio and model reuse
        run: node tests/repeat-audio.test.mjs
      - name: Validate 3D Prayer Room and Hifdh UI source
        run: |
          node --check prayer_room_scene.js
          node --check prayer_room_lounge_scene.js
          node --check prayer_room_ui.js
          node --check hifdh_planner_ui.js
      - name: Test Prayer Room shop, preview and controls
        run: node tests/prayer-room-ui.test.mjs
      - name: Test luxury Window Lounge geometry and prayer-time moods
        run: node tests/prayer-room-lounge.test.mjs
      - name: Test Noor Hifdh journey and focus workflow
        run: node tests/hifdh-planner-ui.test.mjs
      - name: Verify design assets exist
        run: test -s studio.css && test -s studio.js && test -s prayer_room.css && test -s prayer_room_lounge_scene.js && test -s hifdh_planner.css
