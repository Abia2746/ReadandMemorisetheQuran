name: Al-Mu'allim Next.js PWA build

on:
  push:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/next-pwa.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"

jobs:
  nextjs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Next.js dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript strict check
        run: npm run typecheck
      - name: Production server build
        run: npm run build
      - name: Confirm server bundle and static assets
        run: |
          test -f .next/BUILD_ID
          test -f public/manifest.webmanifest
      - name: Auth route static safety checks
        run: |
          test -s app/api/account/route.ts
          test -s app/auth/confirm/route.ts
          grep -q 'httpOnly:true' lib/serverSession.ts
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r apps/api/requirements.txt
      - run: python -m compileall -q apps/api/app
      - run: PYTHONPATH=apps/api python -m pytest -q apps/api/tests
